name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting something. Please describe the problem and your proposed solution.

        **Proposing a new lesson?** Use the
        [Lesson Proposal](?template=lesson_proposal.yml) form instead — it asks the
        questions we actually need answered before you start writing.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's missing or frustrating?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Existing lesson — improve or extend one
        - Lesson interactive — add or improve a widget
        - New track — a whole new topic
        - Learn shell — sidebar, table of contents, pager, navigation
        - Marketing site
        - Documentation
        - Developer experience — scripts, tooling, CI
        - Accessibility
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, or any other context.
