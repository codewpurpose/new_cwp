name: Bug Report
description: Report something broken on the site, or wrong in a lesson
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If a lesson says something that is factually wrong,
        this is the right form — you do not need to fix it yourself.

  - type: dropdown
    id: area
    attributes:
      label: Where is it?
      options:
        - A lesson — wrong, confusing, or broken content
        - A lesson interactive — chart or control misbehaving
        - The learn shell — sidebar, table of contents, pager, navigation
        - Marketing pages — home, about, courses, join, impact, blog, contact
        - Build and tooling — scripts, CI, local dev
        - Other
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where you saw it.
      placeholder: https://codewithpurpose.org/learn/ml/train-test-split/
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: >
        For a content bug: what the lesson says, and what is actually true.
        For a functional bug: what you did and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Only needed for a visual or interactive bug.
      placeholder: Safari 18, iPhone 15

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Only needed for a build or tooling bug.
      options:
        - Not applicable
        - macOS
        - Windows
        - Linux

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Only needed for a build or tooling bug. Run `node -v`.
      placeholder: v24.x.x

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, console output, or anything else useful.
